name: 🧪 CI - Fermi Paradox

on:
  push:
    branches: [ "main", "src/refactor" ]
  pull_request:
    branches: [ "main", "src/refactor" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up uv
        uses: astral-sh/setup-uv@v6

      - name: 📦 Install dependencies
        run: uv sync --locked

      - name: 🔍 Run linter (ruff)
        run: uv run ruff check src/fermi_paradox

      - name: 🧪 Run tests with coverage
        run: uv run pytest --cov=src/fermi_paradox --cov-report=term-missing -v --disable-warnings

      - name: 📊 Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

